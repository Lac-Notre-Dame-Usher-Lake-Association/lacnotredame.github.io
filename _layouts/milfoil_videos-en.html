<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Preview Example</title>
</head>
<body>

    <h2>Video with Preview Thumbnail</h2>

    <!-- Video element with controls and preview image -->
    <video width="640" height="360" controls poster="thumbnail.jpg">
        <source src="https://www.youtube.com/watch?v=lHdjJ0dmTpo" type="video/mp4">

    </video>

</body>
</html>
