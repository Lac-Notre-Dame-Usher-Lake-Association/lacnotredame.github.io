<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Slideshow</title>

<style>
.slideshow {
  width: 500px;
  height: 300px;
  overflow: hidden;
  position: relative;
}

.slides {
  display: flex;
  width: 500px;
  animation: slide 15s infinite;
}

.slides img {
  width: 500px;
  height: 300px;
  object-fit: cover;
}

@keyframes slide {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-100%); }
  40%  { transform: translateX(-200%); }
  60%  { transform: translateX(-300%); }
  68%  { transform: translateX(-400%); }
  82%  { transform: translateX(-500%); }
  100%  { transform: translateX(0); }

}
</style>
</head>
<body>
<div class="slideshow">
  <div class="slides">
    <img src="/assets/img/Lac-Hiver-8.jpeg">
    <img src="/assets/img/Lac-Hiver-4.jpg">
    <img src="/assets/img/Lac-Hiver-3.jpg">
    <img src="/assets/img/Lac-Hiver-6.jpg">
    <img src="/assets/img/Lac-Hiver-2.jpg">
    <img src="/assets/img/Lac-Hiver-1.jpg">
  </div>
</div>
</body>
</html>
