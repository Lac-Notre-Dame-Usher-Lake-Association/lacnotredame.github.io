<!DOCTYPE html>
<html>
<style>
.carousel-container {
  width: 500px;
  max-width: 100%;
  height: 300px;          /* small window height */
  overflow: hidden;
}

.carousel {
  width: 100%;
  height: 100%;
}

.track {
  display: flex;
  animation: scroll 15s linear infinite;
}
.track img {
  width: 500px;
}
@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}

</style>
<div class="carousel-container">
  <div class="carousel">
    <div class="track">
    <img src="/assets/img/Lac-Hiver-8.jpeg" class="slide" width="500" height="300">
    <img src="/assets/img/Lac-Hiver-4.jpg" class="slide" width="500" height="300">
    <img src="/assets/img/Lac-Hiver-3.jpg" class="slide" width="500" height="300">
    <img src="/assets/img/Lac-Hiver-6.jpg" class="slide" width="500" height="300">
    <img src="/assets/img/Lac-Hiver-2.jpg" class="slide" width="500" height="300">
    <img src="/assets/img/Lac-Hiver-1.jpg" class="slide" width="500" height="300">
  </div>
 </div>
</div>
</html>
