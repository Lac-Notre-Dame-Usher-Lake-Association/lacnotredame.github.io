<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}en{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
      <div class="container-fluid px-0">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img src="/assets/img/lacnotredame-logo.png" alt="Lac Notre-Dame logo" height="40" class="me-2">
          <span class="h5 mb-0">{{ site.title }}</span>
        </a>     
      </div>
    </nav>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
      <div class="container-fluid px-0">
        <a class="navbar-brand d-flex align-items-center" href="/">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        </a>  
        <div class="collapse navbar-collapse" id="mainNav">
           <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            {% if site.data.navigation %}
              {% for item in site.data.navigation %}
                <li class="nav-item">
                  <a class="nav-link {% if page.url == item.url or page.url == item.url | append: 'index.html' %}active{% endif %}" href="{{ item.url }}">{{ item.title }}</a>
                </li>
              {% endfor %}
            {% else %}
              <!-- Fallback: hard-coded links if no data file present -->
              <li class="nav-item"><a class="nav-link {% if page.url == '/' %}active{% endif %}" href="/">Home</a></li>
              <li class="nav-item"><a class="nav-link {% if page.url == '/water/' %}active{% endif %}" href="/water/Guidelines/">Guidelines</a></li>
              <li class="nav-item"><a class="nav-link {% if page.url == '/water/' %}active{% endif %}" href="/water/lnd-milfoil/">Milfoil</a></li>
              <li class="nav-item"><a class="nav-link {% if page.url == '/water/' %}active{% endif %}" href="/water/qualityreports/">Water</a></li>
            {% endif %}
            </ul>
        </div>
      </div>
    </nav>
    <!-- END NAVBAR -->
    
    <main>
      {{ content }}
    </main>

    <footer class="mt-5 py-3 text-center text-muted">
      <p>&copy; {{ site.time | date: '%Y' }} Lac Notre-Dame and Usher Lake Association</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
