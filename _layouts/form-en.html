<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RSVP Form</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .rsvp-container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    background: #007BFF;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>

<body>

<div class="rsvp-container">
  <h2>RSVP to 2026 Milfoil Strategy Meeting</h2>

  <!-- <form action="mailto:info@lacnotredame.org" method="POST" enctype="text/plain"> -->
  
  <form action="https://formspree.io/f/mvzwykry" method="POST"> 
    
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="attending">Will you attend?</label>
    <select id="attending" name="attending" required>
      <option value="">-- Select --</option>
      <option value="yes">Yes, I can attend</option>
      <option value="no">No, I cannot attend but please keep me informed</option>
    </select>

    <!--
    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" name="guests" min="0" max="10">

    <label for="meal">Meal Preference</label>
    <select id="meal" name="meal">
      <option value="">-- Select --</option>
      <option value="chicken">Chicken</option>
      <option value="beef">Beef</option>
      <option value="vegetarian">Vegetarian</option>
    </select>
    -->
    
    <label for="message">Message (optional)</label>
    <textarea id="message" name="message" rows="3"></textarea>

    <button type="submit">Submit</button>
    
    <!-- <input type="submit" value="Send RSVP"> -->

  </form>
</div>

</body>
</html>
